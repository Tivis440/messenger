name: Build Windows Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-client.yml"
      - "protocol.h"
      - "untitled/**"
      - "deploy/windows-client/**"

jobs:
  build:
    name: Windows x64 client
    runs-on: windows-2022

    env:
      QT_VERSION: "6.7.2"
      QT_ARCH: "win64_msvc2019_64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          cache: true

      - name: Install OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install openssl.light -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "openssl.light was not installed, trying openssl package..."
            choco install openssl -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey could not install OpenSSL."
            }
          }

          $roots = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL",
            "C:\OpenSSL-Win64",
            "C:\tools\OpenSSL-Win64",
            "C:\ProgramData\chocolatey\lib\openssl.light",
            "C:\ProgramData\chocolatey\lib\openssl"
          ) | Where-Object { Test-Path $_ }
          $opensslRoot = $roots | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $opensslRoot) {
            throw "OpenSSL installation directory was not found."
          }
          Write-Host "OpenSSL root: $opensslRoot"

          $includeDir = Get-ChildItem $opensslRoot -Directory -Recurse |
            Where-Object { Test-Path (Join-Path $_.FullName "openssl\evp.h") } |
            Select-Object -First 1
          $cryptoLib = Get-ChildItem $opensslRoot -Recurse -Filter libcrypto.lib | Select-Object -First 1
          if (-not $includeDir -or -not $cryptoLib) {
            Get-ChildItem $opensslRoot -Recurse -Include evp.h,libcrypto.lib,libssl.lib | Select-Object FullName
            throw "OpenSSL headers or libcrypto.lib were not found in $opensslRoot."
          }
          Write-Host "OpenSSL include: $($includeDir.FullName)"
          Write-Host "OpenSSL libcrypto: $($cryptoLib.FullName)"

          New-Item -ItemType Directory -Force deps\openssl\include deps\openssl\lib deps\openssl\bin | Out-Null
          Copy-Item "$($includeDir.FullName)\*" deps\openssl\include\ -Recurse -Force
          Copy-Item $cryptoLib.FullName deps\openssl\lib\libcrypto.lib -Force
          $sslLib = Get-ChildItem $opensslRoot -Recurse -Filter libssl.lib | Select-Object -First 1
          if ($sslLib) {
            Copy-Item $sslLib.FullName deps\openssl\lib\libssl.lib -Force
          }
          Get-ChildItem $opensslRoot -Recurse -Include libcrypto*.dll,libssl*.dll |
            Copy-Item -Destination deps\openssl\bin\ -Force

      - name: Build libsignal-protocol-c
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps | Out-Null
          git clone --depth 1 https://github.com/signalapp/libsignal-protocol-c.git deps/libsignal-protocol-c-src
          cmake `
            -S deps/libsignal-protocol-c-src `
            -B deps/libsignal-protocol-c-build `
            -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${env:GITHUB_WORKSPACE}\deps\signal" `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DBUILD_TESTING=OFF
          cmake --build deps/libsignal-protocol-c-build --config Release
          cmake --install deps/libsignal-protocol-c-build

      - name: Build messenger.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Push-Location build
          qmake ..\untitled\untitled.pro `
            "SIGNAL_DIR=${env:GITHUB_WORKSPACE}\deps\signal" `
            "OPENSSL_DIR=${env:GITHUB_WORKSPACE}\deps\openssl" `
            CONFIG+=release
          nmake
          Pop-Location

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          windeployqt --release build\release\messenger.exe
          Copy-Item "deps\openssl\bin\*.dll" build\release\ -ErrorAction SilentlyContinue
          Copy-Item "deps\signal\bin\*.dll" build\release\ -ErrorAction SilentlyContinue

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path build\release\* -DestinationPath messenger-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-windows
          path: messenger-windows.zip
          if-no-files-found: error
