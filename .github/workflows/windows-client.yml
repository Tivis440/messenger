name: Build Windows Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-client.yml"
      - "protocol.h"
      - "untitled/**"
      - "deploy/windows-client/**"

jobs:
  build:
    name: Windows x64 client
    runs-on: windows-2022

    env:
      QT_VERSION: "6.7.2"
      QT_ARCH: "win64_msvc2019_64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          cache: true

      - name: Download OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.firedaemon.com/FireDaemon-OpenSSL/openssl-3.5.7.zip"
          $archive = "$env:RUNNER_TEMP\openssl-3.5.7.zip"
          curl.exe -L --fail --retry 5 --retry-delay 3 -o $archive $url

      - name: Verify OpenSSL archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedHash = "2591459A06A6DF2D2E2B23B02A28D7C180B95C02FB4965099A708B7365A74014"
          $archive = "$env:RUNNER_TEMP\openssl-3.5.7.zip"
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "OpenSSL archive SHA256 mismatch. Expected $expectedHash, got $actualHash."
          }

      - name: Extract OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "$env:RUNNER_TEMP\openssl-3.5.7.zip"
          $extractDir = "$env:RUNNER_TEMP\openssl-3.5.7"
          New-Item -ItemType Directory -Force $extractDir | Out-Null
          tar -xf $archive -C $extractDir

      - name: Stage OpenSSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $extractDir = "$env:RUNNER_TEMP\openssl-3.5.7"
          $includeDir = Get-ChildItem $extractDir -Directory -Recurse |
            Where-Object { $_.FullName -like "*\x64\*" -and (Test-Path (Join-Path $_.FullName "openssl\evp.h")) } |
            Select-Object -First 1
          $cryptoLib = Get-ChildItem $extractDir -Recurse -File -Filter libcrypto.lib |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Select-Object -First 1
          $sslLib = Get-ChildItem $extractDir -Recurse -File -Filter libssl.lib |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Select-Object -First 1
          $dlls = Get-ChildItem $extractDir -Recurse -File |
            Where-Object { $_.FullName -like "*\x64\*" -and ($_.Name -like "libcrypto*.dll" -or $_.Name -like "libssl*.dll") }

          if (-not $includeDir -or -not $cryptoLib -or -not $sslLib -or -not $dlls) {
            Get-ChildItem $extractDir -Recurse -File |
              Where-Object { $_.Name -in @("evp.h", "libcrypto.lib", "libssl.lib") -or $_.Name -like "libcrypto*.dll" -or $_.Name -like "libssl*.dll" } |
              Select-Object FullName
            throw "OpenSSL files were not found after extraction."
          }

          New-Item -ItemType Directory -Force -Path deps\openssl\include, deps\openssl\lib, deps\openssl\bin | Out-Null
          Copy-Item "$($includeDir.FullName)\*" deps\openssl\include\ -Recurse -Force
          Copy-Item $cryptoLib.FullName deps\openssl\lib\libcrypto.lib -Force
          Copy-Item $sslLib.FullName deps\openssl\lib\libssl.lib -Force
          $dlls | Copy-Item -Destination deps\openssl\bin\ -Force
          Get-ChildItem deps\openssl -Recurse -File |
            Where-Object { $_.Name -in @("evp.h", "libcrypto.lib", "libssl.lib") -or $_.Name -like "libcrypto*.dll" -or $_.Name -like "libssl*.dll" } |
            Select-Object FullName

      - name: Clone libsignal-protocol-c
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deps | Out-Null
          git clone --depth 1 https://github.com/signalapp/libsignal-protocol-c.git deps/libsignal-protocol-c-src

      - name: Patch libsignal-protocol-c for MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $curveCmake = "deps\libsignal-protocol-c-src\src\curve25519\CMakeLists.txt"
          $content = Get-Content $curveCmake -Raw
          $content = $content -replace "\r?\n\s*ed25519/tests/internal_fast_tests\.c", ""
          Set-Content -Path $curveCmake -Value $content -NoNewline
          Get-Content $curveCmake | Select-String "internal_fast_tests" -Quiet | ForEach-Object {
            if ($_) { throw "Failed to remove internal_fast_tests.c from curve25519 build." }
          }

      - name: Configure libsignal-protocol-c
        shell: pwsh
        run: |
          cmake `
            -S deps/libsignal-protocol-c-src `
            -B deps/libsignal-protocol-c-build `
            -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${env:GITHUB_WORKSPACE}\deps\signal" `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_C_FLAGS="/D_WINDOWS /D_CRT_SECURE_NO_WARNINGS" `
            -DOPENSSL_ROOT_DIR="${env:GITHUB_WORKSPACE}\deps\openssl" `
            -DBUILD_TESTING=OFF

      - name: Build libsignal-protocol-c
        shell: pwsh
        run: |
          cmake --build deps/libsignal-protocol-c-build --config Release

      - name: Install libsignal-protocol-c
        shell: pwsh
        run: |
          $signalLib = Get-ChildItem deps\libsignal-protocol-c-build -Recurse -File -Filter "signal-protocol-c.lib" |
            Select-Object -First 1
          if (-not $signalLib) {
            $signalLib = Get-ChildItem deps\libsignal-protocol-c-build -Recurse -File -Filter "*.lib" |
              Select-Object -First 1
          }
          if (-not $signalLib) {
            throw "libsignal-protocol-c .lib file was not built."
          }
          New-Item -ItemType Directory -Force -Path deps\signal\include\signal, deps\signal\lib | Out-Null
          Copy-Item $signalLib.FullName deps\signal\lib\signal-protocol-c.lib -Force
          Copy-Item deps\libsignal-protocol-c-src\src\*.h deps\signal\include\signal\ -Force
          Get-ChildItem deps\signal -Recurse -File |
            Where-Object { $_.Name -eq "signal_protocol.h" -or $_.Name -eq "signal-protocol-c.lib" } |
            Select-Object FullName

      - name: Configure messenger.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Push-Location build
          qmake ..\untitled\untitled.pro `
            "SIGNAL_DIR=${env:GITHUB_WORKSPACE}\deps\signal" `
            "OPENSSL_DIR=${env:GITHUB_WORKSPACE}\deps\openssl" `
            CONFIG+=release
          Pop-Location

      - name: Build messenger.exe
        shell: pwsh
        run: |
          Push-Location build
          $output = nmake 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath "${env:GITHUB_WORKSPACE}\windows-nmake.log"
          Pop-Location
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Report Windows build errors
        if: failure()
        shell: pwsh
        run: |
          $log = "${env:GITHUB_WORKSPACE}\windows-nmake.log"
          if (Test-Path $log) {
            Get-Content $log |
              Select-String -Pattern "error|fatal|LNK[0-9]+|C[0-9]{4}" |
              ForEach-Object { Write-Host "::error::$($_.Line)" }
          }

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          windeployqt --release build\release\messenger.exe
          Copy-Item "deps\openssl\bin\*.dll" build\release\ -ErrorAction SilentlyContinue
          Copy-Item "deps\signal\bin\*.dll" build\release\ -ErrorAction SilentlyContinue

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path build\release\* -DestinationPath messenger-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: messenger-windows
          path: messenger-windows.zip
          if-no-files-found: error

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: windows-nmake.log
          if-no-files-found: ignore
